name: Numba compatibility

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            numba: "0.61.0"
            numpy: "2.1.3"
          - python: "3.12"
            numba: "0.61.0"
            numpy: "2.1.3"
          - python: "3.12"
            numba: "0.64.0"
            numpy: "2.4.6"
          - python: "3.12"
            numba: "0.66.0"
            numpy: "2.4.6"
    name: Python ${{ matrix.python }} / Numba ${{ matrix.numba }}
    env:
      SELLA_DISABLE_GPU: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install supported dependency versions
        run: >-
          python -m pip install -e '.[test]'
          'numba==${{ matrix.numba }}' 'numpy==${{ matrix.numpy }}'
      - name: Test coordinate kernels and optimizers
        run: python -m pytest -q -m 'not slow'
